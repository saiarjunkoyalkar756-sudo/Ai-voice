<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="58" fill="url(#bgGrad)" stroke="#22c55e" stroke-width="2.5" stroke-opacity="0.3"/>
  <!-- 5 V-Waveform Bars in center -->
  <g transform="translate(68, 62)">
    <rect x="0" y="14" width="14" height="104" rx="7" fill="url(#waveGrad)"/>
    <rect x="27" y="38" width="14" height="80" rx="7" fill="url(#waveGrad)"/>
    <rect x="54" y="68" width="14" height="60" rx="7" fill="#4ade80" filter="url(#iconGlow)"/>
    <rect x="81" y="38" width="14" height="80" rx="7" fill="url(#waveGrad)"/>
    <rect x="108" y="14" width="14" height="104" rx="7" fill="url(#waveGrad)"/>
  </g>
</svg>