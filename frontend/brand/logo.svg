<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" fill="none">
  <defs>
    <linearGradient id="brandWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="centerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- V-Waveform Acoustic Monogram -->
  <g transform="translate(14, 22)">
    <rect x="0" y="8" width="10" height="66" rx="5" fill="url(#brandWave)"/>
    <rect x="18" y="24" width="10" height="50" rx="5" fill="url(#brandWave)"/>
    <rect x="36" y="44" width="10" height="36" rx="5" fill="url(#centerGlow)" filter="url(#glow)"/>
    <rect x="54" y="24" width="10" height="50" rx="5" fill="url(#brandWave)"/>
    <rect x="72" y="8" width="10" height="66" rx="5" fill="url(#brandWave)"/>
  </g>
  <!-- Wordmark -->
  <text x="122" y="78" font-family="'Cy Grotesk Wide', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="56" fill="#ffffff" letter-spacing="-0.03em">Voicely</text>
  <circle cx="366" cy="73" r="7" fill="#22c55e" filter="url(#glow)"/>
</svg>