<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="sqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="vyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="yGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="mintGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Squircle Frame -->
  <rect x="12" y="12" width="232" height="232" rx="58" fill="url(#sqBg)" stroke="#22c55e" stroke-width="2.5" stroke-opacity="0.35"/>

  <!-- Vy Ligature Path -->
  <!-- "V" left stroke -->
  <path d="M 52 82 L 86 168 C 88 173 95 173 97 168 L 126 94 C 128 89 135 89 137 94 L 166 168 C 168 173 175 173 177 168 L 204 98" stroke="url(#vyGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- "y" descending tail with acoustic wave curve -->
  <path d="M 172 154 L 140 216 C 135 226 122 230 112 224 C 104 219 101 208 106 200 L 118 180" stroke="url(#yGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#mintGlow)"/>

  <!-- Pulse Dot -->
  <circle cx="198" cy="80" r="7.5" fill="#22c55e" filter="url(#mintGlow)"/>
</svg>